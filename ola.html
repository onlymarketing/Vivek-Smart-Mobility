# Full Working Fixed Index Page

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivek Smart Mobility</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#09090b;overflow-x:hidden;}
.hero-bg{background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),url('hero.webp');background-size:cover;background-position:center;}
.lang-btn.active{background:#f97316;color:#fff;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 22px;border-radius:999px;z-index:99999;}
</style>
</head>
<body>

<!-- LANGUAGE POPUP -->
<div id="langModal" style="display:none" class="fixed inset-0 bg-black/90 z-[99999] items-center justify-center px-4">

<div class="space-y-4">
<button onclick="selectLanguage('en')" class="w-full h-14 rounded-2xl bg-orange-500 text-white font-bold text-lg">English</button>
<button onclick="selectLanguage('ta')" class="w-full h-14 rounded-2xl bg-zinc-900 text-white font-bold text-lg">தமிழ்</button>
</div>
</div>
</div>

<!-- NAVBAR -->
<nav class="bg-white sticky top-0 z-50 border-b border-zinc-200">
<div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">

<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-orange-500">
<img src="logo.png" class="w-full h-full object-cover">
</div>
<div>
<h1 id="logoText" class="font-bold text-orange-500">Vivek Smart Mobility</h1>
<p id="logoSub" class="text-xs text-zinc-500">Ola • Uber • Rapido</p>
</div>
</div>

<!-- HERO -->

<div class="max-w-5xl mx-auto px-5 text-center">

<p id="heroSub" class="text-lg md:text-2xl text-white/90">Cab Attachment • Insurance • Driver Jobs • WhatsApp Support</p>

<i class="fa-solid fa-paper-plane"></i> Apply Now

<div>
<label id="labelService" class="block mb-2 font-semibold text-sm">Choose Service *</label>
<select id="serviceSelect" class="w-full border-2 border-zinc-300 rounded-2xl px-5 py-4 outline-none">
<option value="">Select Service</option>
<option value="Attachment">Ola Uber Rapido Attachment</option>
<option value="Insurance">Insurance</option>

</select>
</div>

<label id="labelName" class="block mb-2 font-semibold text-sm">Full Name *</label>
<input id="inputName" type="text" class="w-full border-2 border-zinc-300 rounded-2xl px-5 py-4 outline-none" placeholder="Enter your name">
</div>

<div>
<label id="labelMobile" class="block mb-2 font-semibold text-sm">Mobile Number *</label>
<input id="inputMobile" type="tel" maxlength="10" class="w-full border-2 border-zinc-300 rounded-2xl px-5 py-4 outline-none" placeholder="Your mobile number">
</div>

<div>
<label id="labelCity" class="block mb-2 font-semibold text-sm">City / Area *</label>
<input id="inputCity" type="text" class="w-full border-2 border-zinc-300 rounded-2xl px-5 py-4 outline-none" placeholder="Chennai">
</div>

<button onclick="submitToWhatsApp()" class="w-full bg-[#25D366] text-white h-14 rounded-2xl font-bold text-lg flex items-center justify-center gap-3">
<i class="fa-brands fa-whatsapp text-2xl"></i>
<span id="sendBtn">Send on WhatsApp</span>
</button>

</div>
</div>
</section>

<script>
const PHONE='7397679900';
let currentLang='en';

const translations={
en:{
logoText:'Vivek Smart Mobility',
heroHeadline:"Tamil Nadu's Trusted Driver Support Platform",
heroSub:'Cab Attachment • Insurance • Driver Jobs • WhatsApp Support',
formTitle:'Apply Now',
labelService:'Choose Service *',
labelName:'Full Name *',
labelMobile:'Mobile Number *',
labelCity:'City / Area *',
sendBtn:'Send on WhatsApp',
callNowTop:'Call Now'
},
ta:{
logoText:'விவேக் ஸ்மார்ட் மொபிலிட்டி',
heroHeadline:'தமிழ்நாட்டின் நம்பகமான டிரைவர் சேவை தளம்',
heroSub:'கேப் இணைப்பு • இன்சூரன்ஸ் • டிரைவர் வேலை',
formTitle:'இப்போதே விண்ணப்பிக்கவும்',
labelService:'சேவையை தேர்ந்தெடுக்கவும் *',
labelName:'முழு பெயர் *',
labelMobile:'மொபைல் எண் *',
labelCity:'நகரம் / பகுதி *',
sendBtn:'வாட்ஸ்அப்பில் அனுப்பு',
callNowTop:'இப்போது அழைக்கவும்'
}
};

function applyLanguage(lang){
currentLang=lang;
localStorage.setItem('siteLanguage',lang);
const t=translations[lang];
document.getElementById('logoText').innerHTML=t.logoText;
document.getElementById('heroHeadline').innerHTML=t.heroHeadline;
document.getElementById('heroSub').innerHTML=t.heroSub;
document.getElementById('formTitle').innerHTML=t.formTitle;
document.getElementById('labelService').innerHTML=t.labelService;
document.getElementById('labelName').innerHTML=t.labelName;
document.getElementById('labelMobile').innerHTML=t.labelMobile;
document.getElementById('labelCity').innerHTML=t.labelCity;
document.getElementById('sendBtn').innerHTML=t.sendBtn;
document.getElementById('callNowTop').innerHTML=t.callNowTop;

if(lang==='ta'){
document.getElementById('serviceSelect').innerHTML=`
<option value=''>சேவையை தேர்ந்தெடுக்கவும்</option>
<option value='Attachment'>Ola Uber Rapido இணைப்பு</option>
<option value='Insurance'>Insurance</option>
<option value='Driver Job'>Driver Job</option>
<option value='RTO Work'>RTO Work</option>`;
}else{
document.getElementById('serviceSelect').innerHTML=`
<option value=''>Select Service</option>
<option value='Attachment'>Ola Uber Rapido Attachment</option>
<option value='Insurance'>Insurance</option>
<option value='Driver Job'>Driver Job</option>
<option value='RTO Work'>RTO Work</option>`;
}
}

function selectLanguage(lang){
applyLanguage(lang);
document.getElementById('langModal').style.display='none';
document.body.style.overflow='auto';
}

function switchLanguage(lang){
applyLanguage(lang);
}

function makeCall(){
window.location.href=`tel:${PHONE}`;
}

function showToast(msg){
const toast=document.createElement('div');
toast.className='toast';
toast.innerHTML=msg;
document.body.appendChild(toast);
setTimeout(()=>toast.remove(),3000);
}

function submitToWhatsApp(){
const service=document.getElementById('serviceSelect').value;
const name=document.getElementById('inputName').value;
const mobile=document.getElementById('inputMobile').value;
const city=document.getElementById('inputCity').value;

if(!service||!name||!mobile){
alert('Fill all fields');
return;
}

const message=`Hi Vivek Smart Mobility!\n\nService: ${service}\nName: ${name}\nMobile: ${mobile}\nCity: ${city}`;
window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(message)}`,'_blank');
showToast('✅ Sent Successfully');
}

document.addEventListener('DOMContentLoaded',()=>{
const saved=localStorage.getItem('siteLanguage');
if(saved){
applyLanguage(saved);
}else{
document.getElementById('langModal').style.display='flex';
document.body.style.overflow='hidden';
}
});
</script>

</body>
</html>
